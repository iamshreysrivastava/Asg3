<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px 0; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .required-star { color: red; }
        .form-label { font-size: 0.9rem; margin-bottom: 0; display: flex; align-items: center; height: 100%; }
        .form-control-sm, .form-select-sm { padding: 0.4rem; }
    </style>
</head>
<body class="d-flex align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card p-4">
                    <h2 class="text-center mb-4 border-bottom pb-2">Student Registration Form</h2>
                    <form class="row g-3">
                        
                        <!-- Row 1 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Roll No.<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="text" class="form-control form-control-sm" required></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Name<span class="required-star">*</span></label>
                                <div class="col-sm-8">
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control" placeholder="First" required>
                                        <input type="text" class="form-control" placeholder="Last" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Father's Name<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="text" class="form-control form-control-sm" required></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">DOB<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="date" class="form-control form-control-sm" required></div>
                            </div>
                        </div>

                        <!-- Row 3 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Mobile No.<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="tel" class="form-control form-control-sm" placeholder="+91..." pattern="^\+91[0-9]{10}$" required></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Email ID<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="email" class="form-control form-control-sm" placeholder="user@mail.com" pattern="[a-z0-9._%+-]+@mail\.com$" required></div>
                            </div>
                        </div>

                        <!-- Row 4 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Password<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="password" class="form-control form-control-sm" required pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Gender<span class="required-star">*</span></label>
                                <div class="col-sm-8 d-flex gap-3 pt-1">
                                    <div class="form-check"><input class="form-check-input" type="radio" name="g" required> Male</div>
                                    <div class="form-check"><input class="form-check-input" type="radio" name="g"> Female</div>
                                </div>
                            </div>
                        </div>

                        <!-- Row 5 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Department<span class="required-star">*</span></label>
                                <div class="col-sm-8 d-flex gap-3 pt-1">
                                    <div class="form-check"><input class="form-check-input" type="radio" name="d" required> CSE</div>
                                    <div class="form-check"><input class="form-check-input" type="radio" name="d"> IT</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Course<span class="required-star">*</span></label>
                                <div class="col-sm-8">
                                    <select class="form-select form-select-sm" required>
                                        <option value="" disabled selected>Select</option>
                                        <option>B.Tech</option>
                                        <option>MCA</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Row 6 -->
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">Photo<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="file" class="form-control form-control-sm" accept=".jpg, .pdf" required></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label class="col-sm-4 form-label fw-bold">City<span class="required-star">*</span></label>
                                <div class="col-sm-8"><input type="text" class="form-control form-control-sm" required></div>
                            </div>
                        </div>

                        <!-- Row 7 -->
                        <div class="col-12">
                            <div class="row">
                                <label class="col-sm-2 form-label fw-bold" style="max-width: 16.6%;">Address<span class="required-star">*</span></label>
                                <div class="col-sm-10" style="flex: 1;"><textarea class="form-control" rows="1" required></textarea></div>
                            </div>
                        </div>

                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow" style="background: #764ba2; border:none;">REGISTER</button>
                            <p class="mt-2 mb-0">Already registered? <a href="login.html" class="text-decoration-none fw-bold" style="color:#764ba2;">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
