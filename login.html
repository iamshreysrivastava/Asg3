<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bootstrap</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .required-star { color: red; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Login</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address<span class="required-star">*</span></label>
                            <input type="email" class="form-control" placeholder="user@mail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password<span class="required-star">*</span></label>
                            <input type="password" class="form-control" 
                                   required 
                                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
                                   title="Must include uppercase, lowercase, number, and special character">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm" style="background: #764ba2; border:none;">LOGIN</button>
                    </form>
                    <p class="text-center mt-3 mb-0">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold" style="color:#764ba2;">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
